[package]
name = "virgo-ai"
version = "0.1.2"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "svg"] }
tokio = { version = "1", features = ["process", "time", "io-util"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# walkdir = "2"
ollama = { path = "ollama" }
config = { path = "config" }
project = { path = "project" }
memory = { path = "memory" }
code = { path = "code" }
agent = { path = "agent" }
chats = { path = "chats" }
terminal = { path = "terminal" }
workspace = { path = "workspace" }
workspaces = { path = "workspaces" }
